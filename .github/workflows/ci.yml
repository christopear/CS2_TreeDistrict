name: Portable core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore TreeDistrict.sln --locked-mode
      - run: dotnet build TreeDistrict.sln --configuration Release --no-restore
      - run: dotnet test TreeDistrict.sln --configuration Release --no-build --no-restore
      - run: dotnet format TreeDistrict.sln --verify-no-changes --no-restore

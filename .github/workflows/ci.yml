name: Portable core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore TreeDistrict.sln --locked-mode
      - run: dotnet build TreeDistrict.sln --configuration Release --no-restore
      - run: dotnet test TreeDistrict.sln --configuration Release --no-build --no-restore
      - run: dotnet format TreeDistrict.sln --verify-no-changes --no-restore

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run schema
      - run: git diff --exit-code -- ../data
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

name: Portable core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore TreeDistrict.sln --locked-mode
      - run: dotnet build TreeDistrict.sln --configuration Release --no-restore
      - run: dotnet test TreeDistrict.sln --configuration Release --no-build --no-restore
      - run: dotnet format TreeDistrict.sln --verify-no-changes --no-restore
